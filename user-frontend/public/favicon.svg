<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark rounded background -->
  <rect width="100" height="100" rx="22" fill="#0f1f1a"/>
  <!-- Graduation cap body (mortarboard top) -->
  <polygon points="50,20 90,38 50,56 10,38" fill="#00d4a0"/>
  <!-- Cap brim left side -->
  <ellipse cx="50" cy="56" rx="40" ry="6" fill="#00b889" opacity="0.5"/>
  <!-- Cap body hang down -->
  <rect x="38" y="54" width="24" height="18" rx="4" fill="#00d4a0"/>
  <!-- Bottom of cap -->
  <ellipse cx="50" cy="72" rx="12" ry="4" fill="#00b889"/>
  <!-- Tassel string -->
  <line x1="90" y1="38" x2="90" y2="60" stroke="#00d4a0" stroke-width="3" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="90" cy="63" r="4" fill="#00d4a0"/>
  <line x1="88" y1="67" x2="85" y2="76" stroke="#00d4a0" stroke-width="2" stroke-linecap="round"/>
  <line x1="90" y1="67" x2="90" y2="77" stroke="#00d4a0" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="67" x2="95" y2="76" stroke="#00d4a0" stroke-width="2" stroke-linecap="round"/>
</svg>